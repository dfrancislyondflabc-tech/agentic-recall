name: CI

# What this proves, and what it does not.
#
# CI runs two scripts, 149 checks in total, both against the SHIPPED tree:
#
#   scripts/verify-stdio.js          30 — starts the real server over stdio and drives it as a client
#                                         does: tools listed, a search, a get, an absence, malformed
#                                         input, and the server surviving each.
#   test/public/run-public-tests.js 119 — contracts over committed fixtures: retrieval, word-order
#                                         discrimination, the corpus boundary (symlink escape, path
#                                         traversal), encodings (CRLF/BOM/mixed/unicode),
#                                         index integrity, cross-process index reload, the guarded
#                                         write door, read-only mode, recent recall under a real
#                                         killed writer — and, since 1.7.1, the SCHEDULER E2E.
#
# 🟥 WHY THE WINDOWS LEG OF `verify` IS NOW LOAD-BEARING AND NOT JUST THOROUGH. Capture's 5-minute
# walk used to come from a macOS LaunchAgent, so on Windows it never ran; 1.7.1 moved the clock into
# the server, and test/public/scheduler-e2e.mjs is the check that says so. It starts a real
# `node index.js` over stdio, waits, and asserts an exchange reached the store, the index and a
# `latest` answer with nothing else installed — then asserts the identical fixture under
# MEMORY_SCHEDULER=0 is captured by nobody. Its budget is ~15 s (~52 s worst case on a cold model
# cache). If it is ever skipped on win32, the platform the feature is FOR is unproved.
#
# Neither depends on the author's memories, on wall-clock time, or on how many documents exist.
#
# It is NOT the author's private suite (1,237 checks), which asserts against their own memories by
# name and cannot ship — the release gate refuses it because several of its tests assert on real
# redaction targets and therefore contain them.

on:
  push:
    branches: [main]
  schedule:
    # npm and Node ship on their own cadence; a break in the published install path
    # arrives without a commit here. Weekly is enough to catch it before a user does.
    - cron: '0 6 * * 1'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 24 is the CURRENT LTS: it is what a new user most likely has, while engines says
        # ">=20". Proving 20 and 22 and shipping to 24 was a gap, not a policy.
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # A fresh HOME on purpose: the server must not need anything from the runner's home
      # directory, and Windows + CRLF is the historically worst area in this project.
      #
      # THE TWO SCRIPTS BY NAME, never `npm test`. This one workflow runs in two repos, and
      # `npm test` does not mean the same thing in both: the released tree rewrites it to exactly
      # these two commands, while in the source repo it is the author's suite, which asserts
      # against the author's own memories and therefore dies on a bare runner at "No index".
      # That mismatch left CI red on 15 of 17 runs -- a permanently failing CI teaches everyone
      # to ignore it, which costs more than having none. Naming the scripts makes both repos run
      # the same 275 checks. The author's suite stays a local gate, because it cannot be anything
      # else.
      - run: node scripts/verify-stdio.js
        env:
          MEMORY_AUTHOR_CORPUS: '0'
      - run: node test/public/run-public-tests.js
        env:
          MEMORY_AUTHOR_CORPUS: '0'

  end-to-end:
    # THE ARTEFACT, DRIVEN LIKE A USER, ON ALL THREE PLATFORMS.
    #
    # This job used to be inline shell on ubuntu-latest only, so Windows and macOS ran the fixture
    # suite but never once indexed a folder of memories, retrieved from it, or imported anything.
    # That is the exact shape of the bug this replaced: `.html` import silently required a macOS
    # binary, imported 2 of 3 files on Linux and Windows with no error, and no job would have
    # noticed. The script is Node rather than shell so all three platforms run identical
    # assertions instead of three dialects of the same intention.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: build an index, retrieve from it, and import three formats
        run: node test/public/e2e-index-and-search.mjs
        env:
          MEMORY_AUTHOR_CORPUS: '0'

  installed-from-npm:
    # 🟥 THE GAP THIS CLOSES, and it cost a false claim in the v1.8.1 release notes. Every job
    # above tests a CHECKOUT: actions/checkout, then `npm install` on the working tree. NOT ONE of
    # them installs the PUBLISHED package from the registry — so `npx agentic-recall`, the command
    # the README leads with, had never run in CI on any platform.
    #
    # It broke on Windows within hours of publishing, and not in this project's code: Node 24/25
    # plus npm 11 on Windows crashes npx's own cache-lock handling with ECOMPROMISED
    # (npm/cli#8710, hitting MCP Inspector and Gemini CLI the same way). A checkout-based job can
    # never see that, because it never touches npx.
    #
    # So this job installs the way a stranger does, on all three platforms, on the Node versions
    # where the bug lives. It runs on a schedule as well as on push, because the failure came from
    # npm's release cadence rather than from a commit here.
    name: install from npm (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.method }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        method: [npx, global]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install and run the PUBLISHED package
        shell: bash
        run: |
          set -x
          # 🟥 OUT OF THE CHECKOUT FIRST. This job gained actions/checkout so the spawn probe below
          # could be imported — and that broke it: with a package.json named agentic-recall in the
          # working directory, `npx -y agentic-recall` resolves the LOCAL tree, which has no
          # node_modules here, giving ERR_MODULE_NOT_FOUND for @modelcontextprotocol/sdk. Six jobs
          # went red on every platform. The cwd trap was already documented one step below; adding
          # the checkout re-introduced it one step above.
          cd "$RUNNER_TEMP"
          if [ "${{ matrix.method }}" = "npx" ]; then
            npx -y agentic-recall --version
          else
            npm i -g agentic-recall
            agentic-recall --version
          fi
      # 🟥 AND SPAWN IT THE WAY A NODE MCP CLIENT DOES — no shell. On Windows `npx` is a .cmd shim
      # that Node's spawn will not resolve without shell:true, so a client following the README
      # verbatim gets `spawn EINVAL` and the server silently never connects. Reported from a real
      # Windows 11 machine; the same gotcha has an open issue against Claude Code itself
      # (anthropics/claude-code#58510). The step above only proves the SHELL can run it — this one
      # proves a client can.
      - name: spawn it as a Node MCP client would
        if: matrix.method == 'npx'
        shell: bash
        run: |
          # 🟥 A NEUTRAL CWD. npx run from inside the checkout resolves the LOCAL package, not the
          # registry — measured: 1.8.2 from the repo while npm served 1.8.1. The probe would then
          # prove the source spawns, which is not the question.
          mkdir -p "$RUNNER_TEMP/mem"
          printf -- '---\nname: probe\ndescription: probe\nmetadata:\n  type: reference\n---\nSpoke tension 100 kgf.\n' > "$RUNNER_TEMP/mem/probe.md"
          cd "$RUNNER_TEMP"
          # 🟥 THE SCRIPT PATH GOES IN AS AN ARGUMENT, NOT INTERPOLATED INTO THE JS.
          # On Windows GITHUB_WORKSPACE is D:\a\agentic-recall\agentic-recall. Substituted into a
          # double-quoted JS string it was re-parsed as escapes and collapsed to
          #   file://D:aagentic-recallagentic-recall/test/... -> TypeError: Invalid URL
          # Both Windows npx jobs failed on that, and it looked exactly like the Windows spawn bug
          # this step exists to detect. Passing argv and building the URL with pathToFileURL keeps
          # the separators intact on every platform.
          node --input-type=module \
            -e "
              const { pathToFileURL } = await import('node:url');
              const { spawnAsAClientTests } = await import(pathToFileURL(process.argv[1]).href);
              let failed = 0;
              await spawnAsAClientTests({
                check: (n, ok, d) => { console.log((ok ? '  PASS  ' : '  FAIL  ') + n + (d ? ' — ' + d : '')); if (!ok) failed++; },
                group: (g) => console.log('=== ' + g + ' ===')
              }, process.argv[2]);
              process.exit(failed ? 1 : 0);
            " "$GITHUB_WORKSPACE/test/public/spawn-as-a-client.mjs" "$RUNNER_TEMP/mem"

  real-book-windows:
    # A REAL book, downloaded, on Windows. The generated stand-in in the main job shares the
    # author's assumptions about what a book looks like; a Gutenberg text has front matter, a
    # table of contents, CRLF line endings, roman-numeral chapters and a licence trailer. Running
    # it found two things the synthetic one could not: the CLI silently ignored an unknown option,
    # and it filed a 434 KB book into the WORKING corpus because the uncategorised-import guard
    # lived only in the MCP path. Network-dependent, so it is its own job and not in the gate.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/public/e2e-index-and-search.mjs
        env:
          MEMORY_AUTHOR_CORPUS: '0'
          MEMORY_E2E_REAL_BOOK: '1'
