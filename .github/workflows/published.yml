# Verify the artefact npm ACTUALLY SERVES — not the tree we built.
#
# 🟥 Every packaging defect found in the week this was written was invisible to `npm test` and
# obvious in the tarball: a missing build stamp, a redaction config left behind, a lockfile naming
# the wrong version, and an unpinned README that a tester and the author spent an evening disputing
# because neither could say which artefact they were looking at.
#
# So this runs AFTER a release exists, against the registry, on all three operating systems —
# because "it works in the repo" has never been the question.
name: published artefact

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'version to check (default: package.json)'
        required: false
  schedule:
    # Weekly. A published tarball cannot change, but `latest` can move under you — and a dist-tag
    # pointing at the wrong release is exactly the class of problem nothing else here would notice.
    - cron: '17 6 * * 1'

jobs:
  published:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # MEM-108: a release event fires ~1 min after `npm publish`, BEFORE the registry serves the new
      # version. Wait for it (≤10 min), then check exactly the version that was seen served.
      - name: wait until npm serves the version
        id: wait
        run: node scripts/wait-for-registry.mjs ${{ github.event.inputs.version }}
      # No `npm ci` on purpose: this job must not depend on the checkout's dependencies. It fetches
      # the published package and installs THAT, the way a stranger does.
      - name: check the published artefact
        run: node scripts/check-published.mjs ${{ steps.wait.outputs.version }}

  # 🟥 THE GAP THE OTHER JOBS LEFT. `published` above installs the artefact and checks its shape.
  # ci.yml's `real-book-windows` imports a REAL Gutenberg book — but from the CHECKOUT. So the
  # thing a stranger installs had never been made to do actual work: import, index, retrieve.
  # Anything living in packaging-PLUS-workload (a file missing from files[], a path that only
  # breaks under %APPDATA%, a model cache that cannot write where npm put it) fell between them.
  #
  # Network-dependent (registry + gutenberg.org), so failures here need reading before believing.
  real-book:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # MEM-108: this job used to ask for agentic-recall@2 and, racing the registry on 2.1.5's release,
      # ran 2.1.4 and PASSED. Now it waits for, and installs, the exact version.
      - name: wait until npm serves the version
        id: wait
        run: node scripts/wait-for-registry.mjs ${{ github.event.inputs.version }}
      - name: install from npm and do real work
        run: node test/public/published-real-book.mjs agentic-recall@${{ steps.wait.outputs.version }}
